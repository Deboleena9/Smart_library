<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EduLibrary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-slate-800 to-emerald-900 h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 md:p-10 rounded-2xl shadow-2xl w-full max-w-md transform transition-all">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold tracking-tight text-indigo-900 mb-1">EduLibrary</h1>
            <p class="text-sm text-slate-500">Welcome back! Please enter your details.</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">User ID / Regd. No.</label>
                <input type="text" id="userId" required placeholder="e.g., admin or 2024CS015" 
                    class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="password" id="password" required placeholder="••••••••" 
                    class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all">
            </div>

            <button type="submit" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors shadow-md flex justify-center items-center gap-2">
                Sign In &rarr;
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-xs text-slate-400">Testing? Use ID: <strong class="text-indigo-600">admin</strong> for Librarian or <strong class="text-emerald-600">student</strong> for Student portal.</p>
        </div>
    </div>

    <script>
        // Fluent Routing Logic
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Prevents the page from reloading
            const userId = document.getElementById('userId').value.toLowerCase();
            
            // Simple logic to route to the correct HTML file
            if (userId === 'admin') {
                window.location.href = 'librarian.html';
            } else {
                window.location.href = 'student.html';
            }
        });
    </script>
</body>
</html>
