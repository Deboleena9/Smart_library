<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal | EduLibrary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col">

    <header class="bg-indigo-900 text-white sticky top-0 z-20 shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-emerald-400">EduLibrary</h1>
            <div class="flex items-center gap-4">
                <span class="text-sm hidden md:block">Alex Sharma (2024CS015)</span>
                <a href="/" class="text-xs bg-indigo-800 hover:bg-indigo-700 px-3 py-1.5 rounded-md transition-colors">Log Out</a>
            </div>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 md:p-8">
        <div class="max-w-5xl mx-auto space-y-8">

            <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-semibold mb-4 text-slate-800">🔍 Search Library Catalog</h2>
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="Search by book title, author, or ISBN..." 
                        class="w-full px-4 py-3 pl-12 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none bg-slate-50 transition-all text-lg">
                    <span class="absolute left-4 top-3.5 text-slate-400 text-xl">⌕</span>
                </div>
                
                <div id="searchResults" class="mt-4 space-y-3"></div>
            </section>

            <section>
                <h2 class="text-xl font-bold mb-4 text-slate-800">📚 Currently Issued to You</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-white p-5 rounded-xl border-l-4 border-emerald-500 shadow-sm flex justify-between items-center">
                        <div>
                            <h3 class="font-bold text-slate-800 text-lg">Clean Code</h3>
                            <p class="text-sm text-slate-500">Robert C. Martin</p>
                            <div class="mt-2 text-xs font-medium bg-emerald-100 text-emerald-700 inline-block px-2 py-1 rounded">Due in 5 days</div>
                        </div>
                        <div class="text-right">
                            <span class="block text-sm text-slate-400 mb-1">Return By</span>
                            <span class="font-semibold text-slate-700">Oct 24, 2024</span>
                        </div>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <script>
        // 1. Dynamic Database (Pulled directly from Django!)
        const libraryCatalog = [
                {% for book in books %}
                { 
                    title: "{{ book.title|escapejs }}", 
                    author: "{{ book.author|escapejs }}", 
                    isbn: "{{ book.isbn|escapejs }}", 
                    available: {{ book.available_copies }} 
                },
                {% endfor %}
            ];

        // 2. Grab the HTML elements
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');

        // 3. Listen for every single keystroke
        searchInput.addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            
            // Clear results if the search bar is empty
            if (searchTerm.length === 0) {
                searchResults.innerHTML = '';
                return;
            }

            // Filter the mock database
            const filteredBooks = libraryCatalog.filter(book => 
                book.title.toLowerCase().includes(searchTerm) || 
                book.author.toLowerCase().includes(searchTerm) ||
                book.isbn.includes(searchTerm)
            );

            // Generate HTML for the results
            if (filteredBooks.length === 0) {
                searchResults.innerHTML = '<p class="text-slate-500 text-sm italic py-2">No books found matching your search.</p>';
            } else {
                searchResults.innerHTML = filteredBooks.map(book => `
                    <div class="p-4 border border-slate-100 rounded-lg flex justify-between items-center bg-white hover:shadow-md transition-shadow">
                        <div>
                            <h4 class="font-bold text-indigo-900">${book.title}</h4>
                            <p class="text-xs text-slate-500">By ${book.author} | ISBN: ${book.isbn}</p>
                        </div>
                        <div>
                            ${book.available > 0 
                                ? `<span class="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-xs font-bold">Available (${book.available})</span>`
                                : `<span class="bg-red-100 text-red-700 px-3 py-1 rounded-full text-xs font-bold">Checked Out</span>`
                            }
                        </div>
                    </div>
                `).join('');
            }
        });
    </script>
</body>
</html>
