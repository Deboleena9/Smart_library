<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Settings | EduLibrary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex overflow-hidden">

    <aside class="w-64 bg-indigo-900 text-white flex flex-col hidden md:flex">
        <div class="p-6 border-b border-indigo-800">
            <h1 class="text-2xl font-bold tracking-wider text-emerald-400">EduLibrary</h1>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="{% url 'librarian' %}" class="block px-4 py-3 hover:bg-indigo-800 rounded-lg text-sm font-medium transition-colors text-indigo-100">📊 Dashboard</a>
            <a href="{% url 'manage_issues' %}" class="block px-4 py-3 hover:bg-indigo-800 rounded-lg text-sm font-medium transition-colors text-indigo-100">⚡ Issue Desk</a>
            <a href="{% url 'manage_books' %}" class="block px-4 py-3 hover:bg-indigo-800 rounded-lg text-sm font-medium transition-colors text-indigo-100">📚 Manage Books</a>
            <a href="{% url 'manage_students' %}" class="block px-4 py-3 hover:bg-indigo-800 rounded-lg text-sm font-medium transition-colors text-indigo-100">🎓 Students</a>
            <a href="{% url 'manage_settings' %}" class="block px-4 py-3 hover:bg-indigo-800 rounded-lg text-sm font-medium transition-colors text-indigo-100">⚙️ Settings</a>
        </nav>
        <div class="p-4 border-t border-indigo-800">
            <a href="{% url 'logout' %}" class="block w-full px-4 py-2 text-sm text-left text-indigo-200 hover:text-white transition-colors">Log Out</a>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-y-auto p-8">
        <div class="max-w-3xl mx-auto w-full space-y-8">
            
            <h2 class="text-2xl font-bold text-slate-800 border-b pb-4">System Settings</h2>

            {% if messages %}
                {% for message in messages %}
                    <div class="p-4 rounded-lg font-medium {% if message.tags == 'error' %}bg-red-100 text-red-700{% else %}bg-emerald-100 text-emerald-700{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <section class="bg-white p-8 rounded-xl border border-slate-200 shadow-sm">
                <form action="{% url 'manage_settings' %}" method="POST" class="space-y-6">
                    {% csrf_token %}
                    
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Institute / Library Name</label>
                        <input type="text" name="institute_name" value="{{ setting.institute_name }}" required 
                            class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                        <p class="text-xs text-slate-500 mt-2">This name will be displayed prominently on the main login screen.</p>
                    </div>

                    <div class="pt-4 border-t border-slate-100">
                        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-6 rounded-lg transition-colors shadow-sm">
                            Save Settings
                        </button>
                    </div>
                </form>
            </section>
        </div>
    </main>
</body>
</html>
